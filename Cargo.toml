[workspace]
resolver = "3"
members = ["crates/vhs-core", "crates/vhs-ffi", "crates/vhs-slang", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 開発ビルド (`tauri dev`) でも信号処理は最適化しておく
[profile.dev.package.vhs-core]
opt-level = 3

# CRT シェーダーのコンパイル (glslang → naga) と GPU ドライバ層も最適化しないと読み込みが遅い
[profile.dev.package.glslang]
opt-level = 3
[profile.dev.package.glslang-sys]
opt-level = 3
[profile.dev.package.naga]
opt-level = 3
[profile.dev.package.wgpu-core]
opt-level = 3
[profile.dev.package.wgpu-hal]
opt-level = 3
[profile.dev.package.librashader-reflect]
opt-level = 3
[profile.dev.package.librashader-preprocess]
opt-level = 3
[profile.dev.package.librashader-runtime-wgpu]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
