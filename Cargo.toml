[workspace]
resolver = "3"
members = ["crates/vhs-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 開発ビルド (`tauri dev`) でも信号処理は最適化しておく
[profile.dev.package.vhs-core]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
