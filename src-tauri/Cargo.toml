[package]
name = "vhs-next"
description = "VHS / NTSC signal simulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Windows で bin 名と衝突しないよう `_lib` を付ける
name = "vhs_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vhs-core = { path = "../crates/vhs-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2"
# ブラウン管シェーダー (RetroArch slang)
librashader = { version = "0.12.1", default-features = false, features = ["runtime-wgpu", "presets", "preprocess"] }
wgpu = "30"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "exr"] }

# ウィンドウキャプチャ (Windows Graphics Capture) とアプリ音声のループバック (WASAPI)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
